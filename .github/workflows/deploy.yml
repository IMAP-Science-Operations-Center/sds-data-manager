name: Deploy
# Encode the target environment in the run name for readability in the Actions UI.
run-name: "Deploy to ${{ github.event_name == 'push' && 'dev' || inputs.environment }}"

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: prod
      ref:
        description: "Optional git ref (commit SHA, branch, or tag) to deploy (for rollback)"
        required: false
        default: ""
      skip_ialirt:
        description: "For manual prod deploys only: skip deploying IalirtStack"
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: write # needed for tagging, release creation, and the deploy marker ref

jobs:
  cdk-deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------
      # 🧭 Determine environment + AWS role + tagging behavior
      # ----------------------------------------------------
      - name: Determine deployment target
        id: set_account
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ "${GITHUB_REF##*/}" == "dev" ]]; then
              echo "account_name=dev" >> $GITHUB_ENV
              echo "role_arn=arn:aws:iam::449431850278:role/GitHubDeploy" >> $GITHUB_ENV
              echo "should_tag=false" >> $GITHUB_ENV
            else
              echo "Branch not configured for deployment." && exit 1
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.environment }}" == "dev" ]]; then
              echo "account_name=dev" >> $GITHUB_ENV
              echo "role_arn=arn:aws:iam::449431850278:role/GitHubDeploy" >> $GITHUB_ENV
              echo "should_tag=false" >> $GITHUB_ENV
            elif [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
              echo "account_name=prod" >> $GITHUB_ENV
              echo "role_arn=arn:aws:iam::593025701104:role/GitHubDeploy" >> $GITHUB_ENV
              echo "should_tag=true" >> $GITHUB_ENV
            else
              echo "Invalid environment specified." && exit 1
            fi
          else
            echo "Unsupported trigger type" && exit 1
          fi

      # ----------------------------------------------------
      # 🔄 Checkout code (use ref input if provided for rollback)
      # ----------------------------------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      # actions/checkout resolves the "ref" input (branch, tag, or SHA) to a
      # concrete commit. github.sha / the run's headSha do NOT reflect this -
      # they're fixed to whatever triggered the run, so on a rollback deploy
      # (custom ref input) they'd point at the wrong commit. Resolve the real
      # checked-out SHA here so it can be persisted as the deploy baseline below.
      - name: Resolve deployed commit
        id: resolve_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: Gr1N/setup-poetry@v8
        with:
          poetry-version: "2.3.4"

      - name: Install dependencies and app
        run: |
          poetry install --with layer-database --with layer-spice --with layer-processing

      - name: Install cdk
        run: |
          npm install -g aws-cdk

      # https://github.com/aws-actions/configure-aws-credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.role_arn }}
          aws-region: us-west-2

      # ----------------------------------------------------
      # 🧱 CDK Synth + Deploy
      # ----------------------------------------------------
      - name: Synth
        env:
          ACCOUNT_NAME: ${{ env.account_name }}
        run: |
          echo "Synthesizing for environment: $ACCOUNT_NAME"
          # poetry run to get the environment we installed everything into
          poetry run cdk synth --context account_name=$ACCOUNT_NAME

      - name: Deploy
        env:
          ACCOUNT_NAME: ${{ env.account_name }}
          SKIP_IALIRT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' && github.event.inputs.skip_ialirt == 'true' }}
        run: |
          echo "Deploying to environment: $ACCOUNT_NAME"
          echo "SKIP_IALIRT=$SKIP_IALIRT"
          if [[ "$SKIP_IALIRT" == "true" ]]; then
            STACKS="NetworkingStack HostedZoneCertificateStack WebsiteStack SDCStack DagsterStack BackupStack"
          else
            STACKS="--all"
          fi
          # poetry run to get the environment we installed everything into
          poetry run cdk deploy $STACKS --context account_name=$ACCOUNT_NAME --require-approval never

      # ----------------------------------------------------
      # Force ECS redeploy of Dagster daemon + webserver
      # ----------------------------------------------------
      - name: Force new ECS deployment for Dagster
        run: |
          CLUSTER=$(aws ecs list-clusters --region us-west-2 \
            --query "clusterArns[?contains(@, 'DagsterCluster')]" --output text)

          SERVICES=$(aws ecs list-services --cluster "$CLUSTER" --region us-west-2 \
            --query "serviceArns[?contains(@, 'Dagster')]" --output text)

          for svc in $SERVICES; do
            echo "Forcing redeploy of $svc"
            aws ecs update-service --cluster "$CLUSTER" --service "$svc" --force-new-deployment --region us-west-2
          done

          # update-service returns as soon as the redeploy is *requested* - the old
          # tasks are still running and can pick up reprocessing requests below with
          # the pre-deploy dependency config. Block here until the new tasks are
          # actually up and healthy before submitting any reprocessing requests.
          echo "Waiting for services to stabilize: $SERVICES"
          aws ecs wait services-stable --cluster "$CLUSTER" --services $SERVICES --region us-west-2

      # ----------------------------------------------------
      # Check for dependency major_version bumps since last deploy
      # ----------------------------------------------------
      - name: Find last successfully deployed commit
        id: last_deploy
        run: |
          # The deploy baseline is tracked in a dedicated ref per environment
          # (refs/last-deploy/<account_name>), updated below only after a
          # successful deploy. This reflects the commit actually checked out
          # by this workflow (see "Resolve deployed commit"), not the run's
          # headSha, which is wrong for rollback deploys using the "ref" input.
          MARKER_REF="refs/last-deploy/${{ env.account_name }}"
          LAST_SHA=$(git ls-remote origin "$MARKER_REF" | cut -f1)
          echo "last_sha=$LAST_SHA" >> "$GITHUB_OUTPUT"
          if [[ -z "$LAST_SHA" ]]; then
            echo "No previous successful deploy found for ${{ env.account_name }}; skipping reprocess check."
          else
            echo "Last deployed commit: $LAST_SHA"
          fi

      - name: Record deployed commit
        run: |
          git push origin "${{ steps.resolve_sha.outputs.sha }}:refs/last-deploy/${{ env.account_name }}" --force

      - name: Check for dependency major_version bumps since last deploy
        id: detect_jobs
        if: steps.last_deploy.outputs.last_sha != ''
        run: |
          LAST_SHA="${{ steps.last_deploy.outputs.last_sha }}"
          git fetch --depth=1 origin "$LAST_SHA"
          git worktree add --detach /tmp/last-deploy "$LAST_SHA"
          trap 'git worktree remove /tmp/last-deploy --force' EXIT
          JOBS_LIST=$(poetry run python scripts/dependency/reprocess_jobs_for_major_version_bump.py \
            /tmp/last-deploy/sds_data_manager/orchestration)
          echo "jobs=$JOBS_LIST" >> "$GITHUB_OUTPUT"
          git worktree remove /tmp/last-deploy --force
          trap - EXIT

      # Step 2: Retrieve Secrets using the official AWS action
      - name: Get Secrets from Secrets Manager
        id: get_secrets
        if: steps.detect_jobs.outputs.jobs != '' && steps.detect_jobs.outputs.jobs != '[]'
        uses: aws-actions/aws-secretsmanager-get-secrets@v3
        with:
          secret-ids: |
            ,github_action_imap_api_key
          parse-json-secrets: true # Automatically unpacks JSON key-values

      - name: Reprocess jobs that got a major version bump since last deploy
        if: steps.detect_jobs.outputs.jobs != '' && steps.detect_jobs.outputs.jobs != '[]'
        env:
          job_list: ${{ steps.detect_jobs.outputs.jobs }}
          api_key: ${{ env.GITHUB_ACTION_IMAP_API_KEY }}
        run: |
          CURRENT_DATE=$(date +'%Y%m%d')
          URL_ARGS=()
          # If dev, we need to point to the dev API endpoint, otherwise it defaults to prod.
          if [[ "$account_name" != "prod" ]]; then
            URL_ARGS=(--url https://api.dev.imap-mission.com)
          fi
          while read -r row; do
            instrument=$(echo "$row" | jq -r '.instrument')
            data_level=$(echo "$row" | jq -r '.data_level')
            descriptor=$(echo "$row" | jq -r '.descriptor')

            echo "Kicking off full mission reprocessing for instrument: $instrument, data_level: $data_level, descriptor: $descriptor"
            poetry run imap-data-access --api-key "$api_key" "${URL_ARGS[@]}" reprocess --instrument "$instrument" --data-level "$data_level" --descriptor "$descriptor" --start-date 20250924 --end-date "$CURRENT_DATE"
          done < <(echo "$job_list" | jq -c '.[]')


      # ----------------------------------------------------
      # 🏷️ Tag Release (prod only)
      # ----------------------------------------------------
      - name: Create tag
        if: env.should_tag == 'true'
        run: |
          # Configure Git identity for tagging
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Create and push tag
          TAG_NAME="prod-$(date -u +'%Y-%m-%d-%H%M%S')"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          git tag -a "$TAG_NAME" -m "Production deployment on $(date -u)"
          git push origin "$TAG_NAME"
          echo "Created tag $TAG_NAME"
