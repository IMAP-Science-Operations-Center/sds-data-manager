# <---- Warning ---->
# For latest dependency configuration guidelines and requirements,
# please refer to this document https://imap-processing.readthedocs.io/en/latest/development/data-dependency.html#.
# It contains important information such as the default values and expected behavior of these dependencies,
# and how to properly configure them for your pipeline lambdas.
l3a_ancillary_common: &l3a_ancillary_common
  - source: swapi
    data_type: ancillary
    descriptor: azimuthal-transmission
  - source: swapi
    data_type: ancillary
    descriptor: central-effective-area
  - source: swapi
    data_type: ancillary
    descriptor: passband-fit-coefficients


l3a_spice_common: &l3a_spice_common
  - source: ephemeris_reconstructed
    data_type: spice
    descriptor: historical
    required: false
    trigger_job: false
  - source: ephemeris_predicted
    data_type: spice
    descriptor: historical
  - source: planetary_ephemeris
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: planetary_constants
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: attitude_history
    data_type: spice
    descriptor: historical
  - source: leapseconds
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: imap_frames
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: spacecraft_clock
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: science_frames
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: pointing_attitude
    data_type: spice
    descriptor: historical

(l1a, hk):
  partition: daily
  inputs:
    - source: swapi
      data_type: l0
      descriptor: raw
    - source: leapseconds
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: spacecraft_clock
      data_type: spice
      descriptor: historical
      trigger_job: false
  outputs:
    - source: swapi
      data_type: l1a
      descriptor: hk
      major_version: 1
    - source: swapi
      data_type: l1b
      descriptor: hk
      major_version: 1

(l1, sci):
  partition: daily
  inputs:
    - source: swapi
      data_type: l0
      descriptor: raw
    - source: swapi
      data_type: l1a
      descriptor: hk
    - source: leapseconds
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: spacecraft_clock
      data_type: spice
      descriptor: historical
      trigger_job: false
  outputs:
    - source: swapi
      data_type: l1
      descriptor: sci
      major_version: 1

(l2, sci):
  partition: daily
  inputs:
    - source: swapi
      data_type: l1
      descriptor: sci
    - source: swapi
      data_type: ancillary
      descriptor: esa-unit-conversion
    - source: swapi
      data_type: ancillary
      descriptor: lut-notes
  outputs:
    - source: swapi
      data_type: l2
      descriptor: sci
      major_version: 1

(l3a, alpha-sw):
  partition: daily
  inputs:
    - *l3a_spice_common
    - *l3a_ancillary_common
    - source: swapi
      data_type: l2
      descriptor: sci
    - source: mag
      data_type: l1d
      descriptor: norm-rtn
    - source: mag
      data_type: l2
      descriptor: norm-rtn
      required: false
      trigger_job: false
    - source: swapi
      data_type: ancillary
      descriptor: energy-gf-pui-lut
      trigger_job: false
    - source: swapi
      data_type: ancillary
      descriptor: density-of-neutral-helium-lut
      trigger_job: false
    - source: swapi
      data_type: ancillary
      descriptor: efficiency-lut
    - source: swapi
      data_type: ancillary
      descriptor: helium-inflow-vector
      trigger_job: false
    - source: swapi
      data_type: ancillary
      descriptor: hydrogen-inflow-vector
      trigger_job: false
  outputs:
    - source: swapi
      data_type: l3a
      descriptor: alpha-sw
      major_version: 1

(l3a, proton-sw):
  partition: daily
  inputs:
    - *l3a_spice_common
    - *l3a_ancillary_common
    - source: swapi
      data_type: l2
      descriptor: sci
    - source: swapi
      data_type: ancillary
      descriptor: energy-gf-pui-lut
      trigger_job: false
    - source: swapi
      data_type: ancillary
      descriptor: density-of-neutral-helium-lut
      trigger_job: false
    - source: swapi
      data_type: ancillary
      descriptor: efficiency-lut
    - source: swapi
      data_type: ancillary
      descriptor: helium-inflow-vector
      trigger_job: false
    - source: swapi
      data_type: ancillary
      descriptor: hydrogen-inflow-vector
      trigger_job: false
  outputs:
    - source: swapi
      data_type: l3a
      descriptor: proton-sw
      major_version: 1

(l3a, pui-he):
  partition: daily
  inputs:
    - *l3a_spice_common
    - *l3a_ancillary_common
    - source: swapi
      data_type: l2
      descriptor: sci
    - source: swapi
      data_type: ancillary
      descriptor: energy-gf-pui-lut
    - source: swapi
      data_type: ancillary
      descriptor: density-of-neutral-helium-lut
    - source: swapi
      data_type: ancillary
      descriptor: efficiency-lut
      trigger_job: false
    - source: swapi
      data_type: ancillary
      descriptor: helium-inflow-vector
    - source: swapi
      data_type: ancillary
      descriptor: hydrogen-inflow-vector
  outputs:
    - source: swapi
      data_type: l3a
      descriptor: pui-he
      major_version: 1

(l3b, combined):
  partition: daily
  inputs:
    - source: swapi
      data_type: l2
      descriptor: sci
    - source: swapi
      data_type: ancillary
      descriptor: efficiency-lut
    - source: swapi
      data_type: ancillary
      descriptor: energy-gf-sw-lut
  outputs:
    - source: swapi
      data_type: l3b
      descriptor: combined
      major_version: 1
