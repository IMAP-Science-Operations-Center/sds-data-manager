# ========= Common Dependency Groups =========
# Common spice dependencies shared by multiple products
spice_basic: &spice_basic
  - source: leapseconds
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: spacecraft_clock
    data_type: spice
    descriptor: historical
    trigger_job: false

spice_common: &spice_common
  - *spice_basic
  - source: imap_frames
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: science_frames
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: planetary_ephemeris
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: attitude_history
    data_type: spice
    descriptor: historical
  - source: ephemeris_reconstructed
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: ephemeris_predicted
    data_type: spice
    descriptor: best
    trigger_job: false
  - source: pointing_attitude
    data_type: spice
    descriptor: historical

lo_esa_fit_factors: &lo_esa_fit_factors
  - source: lo
    data_type: ancillary
    descriptor: esa-eta-fit-factors

lo_l2_map_inputs: &lo_l2_map_inputs
  - *spice_common
  - *lo_esa_fit_factors
  - source: spin
    data_type: spin
    descriptor: historical
  - source: lo
    data_type: l1b
    descriptor: histrates
  - source: lo
    data_type: l1b
    descriptor: goodtimes
  - source: lo
    data_type: l1b
    descriptor: bgrates

lo_l3_sp_ena_map_inputs: &lo_l3_sp_ena_map_inputs
  - *spice_common
  - source: glows
    data_type: l3e
    descriptor: survival-probability-lo
  - source: lo
    data_type: l1c
    descriptor: pset

# ======== Product-Specific Dependencies ========

# ======== Level L1A ========
(l1a, all):
  partition: repoint
  inputs:
    - source: lo
      data_type: l0
      descriptor: raw
    - *spice_basic
  outputs:
    - source: lo
      data_type: l1a
      descriptor: histogram
      major_version: 1
    - source: lo
      data_type: l1a
      descriptor: nhk
      major_version: 1
    - source: lo
      data_type: l1a
      descriptor: shk
      major_version: 1
    - source: lo
      data_type: l1a
      descriptor: spin
      major_version: 1
    - source: lo
      data_type: l1a
      descriptor: star
      major_version: 1
    - source: lo
      data_type: l1a
      descriptor: de
      major_version: 1
    - source: lo
      data_type: l1a
      descriptor: pcc
      major_version: 1
    - source: lo
      data_type: l1b
      descriptor: nhk
      major_version: 1
    - source: lo
      data_type: l1b
      descriptor: shk
      major_version: 1
    - source: lo
      data_type: l1b
      descriptor: instrument-status-summary
      major_version: 1

