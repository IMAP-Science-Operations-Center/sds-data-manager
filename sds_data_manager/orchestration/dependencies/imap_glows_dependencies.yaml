# <---- Warning ---->
# For latest dependency configuration guidelines and requirements,
# please refer to this document https://imap-processing.readthedocs.io/en/latest/development/data-dependency.html#.
# It contains important information such as the default values and expected behavior of these dependencies,
# and how to properly configure them for your pipeline lambdas.
# ===== Common dependencies ===========
pipline_settings: &pipeline_settings
  - source: glows
    data_type: ancillary
    descriptor: pipeline-settings

spice_basics: &spice_basics
  - source: leapseconds
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: spacecraft_clock
    data_type: spice
    descriptor: historical
    trigger_job: false

hist_spice: &hist_spice
  - *spice_basics
  - source: imap_frames
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: science_frames
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: pointing_attitude
    data_type: spice
    descriptor: historical
    trigger_job: false

# ======== Product-specific dependencies ===========
(l1a, all):
  partition: repoint
  inputs:
    - *spice_basics
    - source: glows
      data_type: l0
      descriptor: raw
  outputs:
    - source: glows
      data_type: l1a
      descriptor: de
    - source: glows
      data_type: l1a
      descriptor: hist

(l1b, de):
  partition: repoint
  inputs:
    - source: glows
      data_type: l1a
      descriptor: de
    - source: glows
      data_type: ancillary
      descriptor: l1b-conversion-table-for-anc-data
  outputs:
    - source: glows
      data_type: l1b
      descriptor: de

(l1b, hist):
  partition: repoint
  inputs:
    - *pipeline_settings
    - *hist_spice
    - source: glows
      data_type: l1a
      descriptor: hist
    - source: spin
      data_type: spin
      descriptor: historical
    - source: glows
      data_type: ancillary
      descriptor: l1b-exclusions-by-instr-team
    - source: glows
      data_type: ancillary
      descriptor: l1b-map-of-excluded-regions
    - source: glows
      data_type: ancillary
      descriptor: l1b-map-of-uv-sources
    - source: glows
      data_type: ancillary
      descriptor: l1b-suspected-transients
    - source: glows
      data_type: ancillary
      descriptor: l1b-conversion-table-for-anc-data
    - source: attitude_history
      data_type: spice
      descriptor: historical
    - source: ephemeris_reconstructed
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: planetary_ephemeris
      data_type: spice
      descriptor: historical
      trigger_job: false
  outputs:
    - source: glows
      data_type: l1b
      descriptor: hist

(l2, hist):
  partition: repoint
  inputs:
    - *pipeline_settings
    - *hist_spice
    - source: glows
      data_type: l1b
      descriptor: hist
    - source: glows
      data_type: ancillary
      descriptor: l2-calibration
  outputs:
    - source: glows
      data_type: l2
      descriptor: hist

(l3a, hist):
  partition: repoint
  inputs:
    - *pipeline_settings
    - source: glows
      data_type: l2
      descriptor: hist
    - source: glows
      data_type: ancillary
      descriptor: l2-calibration
    - source: glows
      data_type: ancillary
      descriptor: l3a-time-dep-bckgrd
    - source: glows
      data_type: ancillary
      descriptor: l3a-map-of-extra-helio-bckgrd
  outputs:
    - source: glows
      data_type: l3a
      descriptor: hist

(l3b, ion-rate-profile):
  partition: daily
  inputs:
    - source: repoint
      data_type: repoint
      descriptor: historical
  outputs:
    - source: glows
      data_type: l3b
      descriptor: ion-rate-profile
    - source: glows
      data_type: l3c
      descriptor: sw-profile
    - source: glows
      data_type: ancillary
      descriptor: l3b-archive
    - source: glows
      data_type: l3d
      descriptor: solar-hist
    - source: glows
      data_type: ancillary
      descriptor: uv-anis
    - source: glows
      data_type: ancillary
      descriptor: lya
    - source: glows
      data_type: ancillary
      descriptor: e-dens
    - source: glows
      data_type: ancillary
      descriptor: p-dens
    - source: glows
      data_type: ancillary
      descriptor: speed
    - source: glows
      data_type: ancillary
      descriptor: phion
    - source: glows
      data_type: l3e
      descriptor: survival-probability-hi-45
    - source: glows
      data_type: l3e
      descriptor: survival-probability-hi-90
    - source: glows
      data_type: l3e
      descriptor: survival-probability-lo
    - source: glows
      data_type: l3e
      descriptor: survival-probability-ul-sf
    - source: glows
      data_type: l3e
      descriptor: survival-probability-ul-hf
    - source: glows
      data_type: ancillary
      descriptor: survival-probability-hi-45-raw
    - source: glows
      data_type: ancillary
      descriptor: survival-probability-hi-90-raw
    - source: glows
      data_type: ancillary
      descriptor: survival-probability-lo-raw
    - source: glows
      data_type: ancillary
      descriptor: survival-probability-ul-sf-raw
    - source: glows
      data_type: ancillary
      descriptor: survival-probability-ul-hf-raw
