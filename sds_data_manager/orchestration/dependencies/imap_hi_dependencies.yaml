# ========= Common Dependency Groups =========
# Common dependencies shared by multiple products
spice_basic: &spice_basic
  - source: leapseconds
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: spacecraft_clock
    data_type: spice
    descriptor: historical
    trigger_job: false

spice_common: &spice_common
  - *spice_basic
  - source: imap_frames
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: planetary_ephemeris
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: attitude_history
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: ephemeris_reconstructed
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: ephemeris_predicted
    data_type: spice
    descriptor: best
    trigger_job: false
  - source: ephemeris_90days
    data_type: spice
    descriptor: best
    trigger_job: false

# ----- Sub section of common dependencies for data level ----
# common SPICE dependencies
spice_l1b: &spice_l1b
  - *spice_common
  - source: spin
    data_type: spin
    descriptor: historical
    trigger_job: false

spice_l1c: &spice_l1c
  - *spice_common
  - source: science_frames
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: pointing_attitude
    data_type: spice
    descriptor: historical
  - source: repoint
    data_type: repoint
    descriptor: historical
    trigger_job: false
  - source: spin
    data_type: spin
    descriptor: historical
    trigger_job: false


spice_l2: &spice_l2
  - source: leapseconds
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: science_frames
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: planetary_ephemeris
    data_type: spice
    descriptor: historical
  - source: ephemeris_reconstructed
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: ephemeris_predicted
    data_type: spice
    descriptor: historical
    trigger_job: false

# common ancillary dependencies
ancillary_45sensor_l2: &ancillary_45sensor_l2
  - source: hi
    data_type: ancillary
    descriptor: 45sensor-cal-prod
  - source: hi
    data_type: ancillary
    descriptor: 45sensor-esa-energies
  - source: hi
    data_type: ancillary
    descriptor: 45sensor-esa-eta-fit-factors

ancillary_90sensor_l2: &ancillary_90sensor_l2
  - source: hi
    data_type: ancillary
    descriptor: 90sensor-cal-prod
  - source: hi
    data_type: ancillary
    descriptor: 90sensor-esa-energies
  - source: hi
    data_type: ancillary
    descriptor: 90sensor-esa-eta-fit-factors

# common science dependencies
l0_data: &l0_data
  - source: hi
    data_type: l0
    descriptor: raw

sensor45_l1c_pset: &sensor45_l1c_pset
  - source: hi
    data_type: l1c
    descriptor: 45sensor-pset
    trigger_job: false
    required: false

sensor90_l1c_pset: &sensor90_l1c_pset
  - source: hi
    data_type: l1c
    descriptor: 90sensor-pset
    trigger_job: false
    required: false

# ======== Product-Specific Dependencies ========
(l1a, all):
  partition: repoint
  inputs:
    - *spice_basic
    - *l0_data
  outputs:
    - source: hi
      data_type: l1a
      descriptor: 45sensor-de
      major_version: 1
    - source: hi
      data_type: l1a
      descriptor: 90sensor-de
      major_version: 1
    - source: hi
      data_type: l1a
      descriptor: 45sensor-diagfee
      major_version: 1
    - source: hi
      data_type: l1a
      descriptor: 90sensor-diagfee
      major_version: 1
    - source: hi
      data_type: l1a
      descriptor: 45sensor-hist
      major_version: 1
    - source: hi
      data_type: l1a
      descriptor: 90sensor-hist
      major_version: 1
    - source: hi
      data_type: l1a
      descriptor: 45sensor-hk
      major_version: 1
    - source: hi
      data_type: l1a
      descriptor: 90sensor-hk
      major_version: 1
    - source: hi
      data_type: l1a
      descriptor: 45sensor-memdmp
      major_version: 1
    - source: hi
      data_type: l1a
      descriptor: 90sensor-memdmp
      major_version: 1

(l1b, hk):
  partition: repoint
  inputs:
    - *spice_basic
    - *l0_data
  outputs:
    - source: hi
      data_type: l1b
      descriptor: 45sensor-hk
      major_version: 1
    - source: hi
      data_type: l1b
      descriptor: 90sensor-hk
      major_version: 1

(l1b, 45sensor-de):
  partition: repoint
  inputs:
    - *spice_l1b
    - source: hi
      data_type: l1a
      descriptor: 45sensor-de
    - source: hi
      data_type: l1b
      descriptor: 45sensor-hk
    - source: hi
      data_type: ancillary
      descriptor: 45sensor-esa-energies
  outputs:
    - source: hi
      data_type: l1b
      descriptor: 45sensor-de
      major_version: 1

(l1b, 45sensor-goodtimes):
  partition: repoint
  inputs:
    - *spice_basic
    - source: repoint
      data_type: repoint
      descriptor: historical
      trigger_job: false
    - source: hi
      data_type: ancillary
      descriptor: 45sensor-cal-prod
    - source: hi
      data_type: l1a
      descriptor: 45sensor-diagfee
    - source: hi
      data_type: l1b
      descriptor: 45sensor-de
      date_range: ["8np",]
    - source: hi
      data_type: l1b
      descriptor: 45sensor-hk
  outputs:
    - source: hi
      data_type: l1b
      descriptor: 45sensor-goodtimes
      major_version: 1

