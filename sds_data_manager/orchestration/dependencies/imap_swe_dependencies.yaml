# and how to properly configure them for your pipeline lambdas.


(l1a, all):
  partition: daily
  inputs:
    - source: swe
      data_type: l0
      descriptor: raw
    - source: leapseconds
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: spacecraft_clock
      data_type: spice
      descriptor: historical
      trigger_job: false
  outputs:
    - source: swe
      data_type: l1a
      descriptor: sci
      major_version: 1
    - source: swe
      data_type: l1a
      descriptor: hk
      major_version: 1
    - source: swe
      data_type: l1a
      descriptor: cem-raw
      major_version: 1

(l1b, sci):
  partition: daily
  inputs:
    - source: swe
      data_type: l1a
      descriptor: sci
    - source: swe
      data_type: ancillary
      descriptor: l1b-in-flight-cal
    - source: swe
      data_type: ancillary
      descriptor: esa-lut
    - source: swe
      data_type: ancillary
      descriptor: eu-conversion
    - source: leapseconds
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: spacecraft_clock
      data_type: spice
      descriptor: historical
      trigger_job: false
  outputs:
    - source: swe
      data_type: l1b
      descriptor: sci
      major_version: 1

(l2, sci):
  partition: daily
  inputs:
    - source: swe
      data_type: l1b
      descriptor: sci
    - source: spin
      data_type: spin
      descriptor: historical
  outputs:
    - source: swe
      data_type: l2
      descriptor: sci
      major_version: 1

(l3, sci):
  partition: daily
  inputs:
    - source: swe
      data_type: l1b
      descriptor: sci
    - source: swe
      data_type: l2
      descriptor: sci
    - source: swe
      data_type: ancillary
      descriptor: config
    - source: swapi
      data_type: l3a
      descriptor: proton-sw
    - source: mag
      data_type: l1d
      descriptor: norm-dsrf
    - source: mag
      data_type: l2
      descriptor: norm-dsrf
      required: false
      trigger_job: false
    - source: imap_frames
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: science_frames
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: ephemeris_reconstructed
      data_type: spice
      descriptor: historical
      required: false
      trigger_job: false
    - source: ephemeris_predicted
      data_type: spice
      descriptor: historical
    - source: leapseconds
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: spacecraft_clock
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: pointing_attitude
      data_type: spice
      descriptor: historical
    - source: planetary_ephemeris
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: planetary_constants
      data_type: spice
      descriptor: historical
      trigger_job: false
  outputs:
    - source: swe
      data_type: l3
      descriptor: sci
      major_version: 1

