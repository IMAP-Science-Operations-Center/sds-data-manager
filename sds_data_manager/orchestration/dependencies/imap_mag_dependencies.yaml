(l2, burst-srf):
  partition: daily
  inputs:
    - source: mag
      data_type: l1b
      descriptor: burst-mago
    - source: mag
      data_type: ancillary
      descriptor: l2-calibration
    - source: mag
      data_type: ancillary
      descriptor: l2-burst-offsets
    - source: imap_frames
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: science_frames
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: pointing_attitude
      data_type: spice
      descriptor: historical
    - source: attitude_history
      data_type: spice
      descriptor: historical
    - source: leapseconds
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: spacecraft_clock
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: ephemeris_reconstructed
      data_type: spice
      descriptor: historical
    - source: ephemeris_predicted
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: planetary_ephemeris
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: planetary_constants
      data_type: spice
      descriptor: historical
      trigger_job: false
  outputs:
    - source: mag
      data_type: l2
      descriptor: burst-srf
    - source: mag
      data_type: l2
      descriptor: burst-dsrf
    - source: mag
      data_type: l2
      descriptor: burst-gse
    - source: mag
      data_type: l2
      descriptor: burst-rtn

