(l1a, all):
  partition: daily
  inputs:
    - source: mag
      data_type: l0
      descriptor: raw
    - source: leapseconds
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: spacecraft_clock
      data_type: spice
      descriptor: historical
      trigger_job: false
  outputs:
    - source: mag
      data_type: l1a
      descriptor: norm-magi
      major_version: 1
    - source: mag
      data_type: l1a
      descriptor: burst-magi
      major_version: 1
    - source: mag
      data_type: l1a
      descriptor: norm-mago
      major_version: 1
    - source: mag
      data_type: l1a
      descriptor: burst-mago
      major_version: 1
    - source: mag
      data_type: l1a
      descriptor: burst-raw
      major_version: 1


