(l1a, all):
  inputs:
    - source: mag
      data_type: l0
      descriptor: raw
    - source: leapseconds
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: spacecraft_clock
      data_type: spice
      descriptor: historical
      trigger_job: false
  outputs:
    - source: mag
      data_type: l1a
      descriptor: norm-magi
    - source: mag
      data_type: l1a
      descriptor: burst-magi
    - source: mag
      data_type: l1a
      descriptor: norm-mago
    - source: mag
      data_type: l1a
      descriptor: burst-mago

(l1b, burst-magi):
