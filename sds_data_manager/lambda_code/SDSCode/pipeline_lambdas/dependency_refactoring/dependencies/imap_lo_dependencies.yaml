(l1b, goodtimes):
  inputs:
    - *spice_basic
    - source: lo
      data_type: l1b
      descriptor: histrates
    - source: lo
      data_type: l1b
      descriptor: de
    - source: lo
      data_type: l1b
      descriptor: nhk
    - source: repoint
      data_type: repoint
