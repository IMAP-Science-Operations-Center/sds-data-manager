# ======== Level L1C ========

(l1c, pset):
  inputs:
    - *spice_common
    - source: spin
      data_type: spin
      descriptor: historical
    - source: repoint
      data_type: repoint
      descriptor: historical
    - source: ephemeris_90days
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: lo
      data_type: l1b
      descriptor: de
    - source: lo
      data_type: l1b
      descriptor: histrates
    - source: lo
      data_type: l1b
      descriptor: goodtimes
    - source: lo
      data_type: l1b
      descriptor: bgrates

# ======== Level L2 ========
