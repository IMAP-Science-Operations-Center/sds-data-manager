# ========= Common Dependency Groups =========
# Common spice dependencies shared by multiple products
spice_basic: &spice_basic
  - source: leapseconds
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: spacecraft_clock
    data_type: spice
    descriptor: historical
    trigger_job: false

spice_common: &spice_common
  - *spice_basic
  - source: imap_frames
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: science_frames
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: planetary_ephemeris
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: attitude_history
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: ephemeris_reconstructed
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: ephemeris_predicted
    data_type: spice
    descriptor: best
    trigger_job: false
  - source: pointing_attitude
    data_type: spice
    descriptor: historical

spice_l2: &spice_l2
  - *spice_basic
  - source: ephemeris_reconstructed
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: ephemeris_predicted
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: imap_frames
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: planetary_ephemeris
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: science_frames
    data_type: spice
    descriptor: historical
    trigger_job: false

lo_90_pset: &lo_90_pset
  - source: lo
    data_type: l1c
    descriptor: pset
    trigger_job: false

lo_esa_fit_factors: &lo_esa_fit_factors
  - source: lo
    data_type: ancillary
    descriptor: esa-eta-fit-factors

# ======== Product-Specific Dependencies ========

# ======== Level L1A ========
(l1a, all):
  inputs:
    - source: lo
      data_type: l0
      descriptor: raw
    - *spice_basic
  outputs:
    - source: lo
      data_type: l1a
      descriptor: histogram
    - source: lo
      data_type: l1a
      descriptor: nhk
    - source: lo
      data_type: l1a
      descriptor: shk
    - source: lo
      data_type: l1a
      descriptor: spin
    - source: lo
      data_type: l1a
      descriptor: star
    - source: lo
      data_type: l1a
      descriptor: de

# ======== Level L1B ========

(l1b, all-rates):
  inputs:
    - *spice_basic
    - source: spin
      data_type: spin
      descriptor: historical
    - source: repoint
      data_type: repoint
      descriptor: historical
    - source: lo
      data_type: ancillary
      descriptor: sweep-table
    - source: lo
      data_type: ancillary
      descriptor: esa-mode-lut
    - source: lo
      data_type: l1a
      descriptor: histogram
    - source: lo
      data_type: l1a
      descriptor: spin
  outputs:
    - source: lo
      data_type: l1b
      descriptor: histrates
    - source: lo
      data_type: l1b
      descriptor: monitorrates
    - source: lo
      data_type: l1b
      descriptor: instrument-status-summary
    - source: lo
      data_type: l1b
