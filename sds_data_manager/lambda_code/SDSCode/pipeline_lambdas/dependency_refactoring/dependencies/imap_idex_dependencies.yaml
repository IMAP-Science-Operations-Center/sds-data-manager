# <---- Warning ---->
# For latest dependency configuration guidelines and requirements,
# please refer to this document https://imap-processing.readthedocs.io/en/latest/development/data-dependency.html#.
# It contains important information such as the default values and expected behavior of these dependencies,
# and how to properly configure them for your pipeline lambdas.

# ======= Common dependencies =============
spice_basics: &spice_basics
  - source: leapseconds
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: spacecraft_clock
    data_type: spice
    descriptor: historical
    trigger_job: false

# ====== IDEX dependencies =============

(l1a, all):
  inputs:
    - *spice_basics
    - source: idex
      data_type: l0
      descriptor: raw
  outputs:
    - source: idex
      data_type: l1a
      descriptor: sci-1week
    - source: idex
      data_type: l1a
      descriptor: msg
    - source: idex
      data_type: l1a
      descriptor: catlst
    - source: idex
      data_type: l1b
      descriptor: catlst

(l1a, msg):
  inputs:
    - source: idex
      data_type: l1a
      descriptor: msg
  outputs:
    - source: idex
      data_type: l1a
      descriptor: msg

(l1b, sci-1week):
  inputs:
    - *spice_basics
    - source: idex
      data_type: l1a
      descriptor: sci-1week
    - source: spin
      data_type: spin
      descriptor: historical
    - source: ephemeris_reconstructed
      data_type: spice
      descriptor: historical
    - source: ephemeris_predicted
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: attitude_history
      data_type: spice
      descriptor: historical
    - source: planetary_ephemeris
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: imap_frames
      data_type: spice
      descriptor: historical
      trigger_job: false
  outputs:
    - source: idex
      data_type: l1b
      descriptor: sci-1week

(l2a, sci-1week):
  inputs:
    - source: idex
      data_type: l1b
      descriptor: sci-1week
    - source: idex
      data_type: ancillary
      descriptor: l2a-calibration-curve-yield-params
    - source: idex
      data_type: ancillary
      descriptor: l2a-calibration-curve-t-rise
  outputs:
    - source: idex
      data_type: l2a
      descriptor: sci-1week

(l2b, all-1mo):
  inputs:
    - *spice_basics
    - source: idex
      data_type: l2a
      descriptor: sci-1week
      trigger_job: false
    - source: idex
      data_type: l1b
      descriptor: msg
      trigger_job: false
  outputs:
    - source: idex
      data_type: l2b
      descriptor: sci-1mo
    - source: idex
      data_type: l2c
      descriptor: rectangular-map-1mo
