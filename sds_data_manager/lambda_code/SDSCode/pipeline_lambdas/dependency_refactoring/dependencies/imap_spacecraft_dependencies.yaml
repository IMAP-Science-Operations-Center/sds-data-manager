(l1a, pointing-attitude):
  inputs:
    - source: repoint
      data_type: repoint
      descriptor: historical
    - source: attitude_history
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: leapseconds
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: spacecraft_clock
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: imap_frames
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: science_frames
      data_type: spice
      descriptor: historical
      trigger_job: false
  outputs:
    - source: spacecraft
      data_type: l1a
      descriptor: pointing-attitude


(l1a, quaternions):
  inputs:
    - source: spacecraft
      data_type: l0
      descriptor: raw
    - source: leapseconds
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: spacecraft_clock
      data_type: spice
      descriptor: historical
      trigger_job: false
  outputs:
    - source: spacecraft
      data_type: l1a
      descriptor: quaternions
