# <---- Warning ---->
# For latest dependency configuration guidelines and requirements,
# please refer to this document https://imap-processing.readthedocs.io/en/latest/development/data-dependency.html#.
# It contains important information such as the default values and expected behavior of these dependencies,
# and how to properly configure them for your pipeline lambdas.

# ====== Common dependencies =============
spice_basics: &spice_basics
  - source: leapseconds
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: spacecraft_clock
    data_type: spice
    descriptor: historical
    trigger_job: false

l0_data: &l0_data
  - source: hit
    data_type: l0
    descriptor: raw

(l1a, all):
  partition: daily
  inputs:
    - *spice_basics
    - *l0_data
  outputs:
    - source: hit
      data_type: l1a
      descriptor: counts-standard
    - source: hit
      data_type: l1a
      descriptor: counts-sectored
    - source: hit
      data_type: l1a
      descriptor: direct-events

(l1b, hk):
  partition: daily
  inputs:
    - *spice_basics
    - *l0_data
  outputs:
    - source: hit
      data_type: l1b
      descriptor: hk


(l1b, sectored-rates):
  partition: daily
  inputs:
    - source: hit
      data_type: l1a
      descriptor: counts-sectored
  outputs:
    - source: hit
      data_type: l1b
      descriptor: sectored-rates

(l1b, standard-rates):
  partition: daily
  inputs:
    - source: hit
      data_type: l1a
      descriptor: counts-standard
  outputs:
    - source: hit
      data_type: l1b
      descriptor: standard-rates

(l1b, summed-rates):
  partition: daily
  inputs:
    - source: hit
      data_type: l1a
      descriptor: counts-standard
  outputs:
    - source: hit
      data_type: l1b
      descriptor: summed-rates

(l2, macropixel-intensity):
  partition: daily
  inputs:
    - source: hit
      data_type: l1b
      descriptor: sectored-rates
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-macropixel-dt0-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-macropixel-dt1-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-macropixel-dt2-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-macropixel-dt3-factors
  outputs:
    - source: hit
      data_type: l2
      descriptor: macropixel-intensity

(l2, standard-intensity):
  partition: daily
  inputs:
    - source: hit
      data_type: l1b
      descriptor: standard-rates
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-standard-dt0-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-standard-dt1-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-standard-dt2-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-standard-dt3-factors
  outputs:
    - source: hit
      data_type: l2
      descriptor: standard-intensity

(l2, summed-intensity):
  partition: daily
  inputs:
    - source: hit
      data_type: l1b
      descriptor: summed-rates
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-summed-dt0-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-summed-dt1-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-summed-dt2-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-summed-dt3-factors
  outputs:
    - source: hit
      data_type: l2
      descriptor: summed-intensity

(l3, direct-events):
  partition: daily
  inputs:
    - source: hit
      data_type: l1a
      descriptor: direct-events
    - source: hit
      data_type: ancillary
      descriptor: range-2A-cosine-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-3A-cosine-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-4A-cosine-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-2B-cosine-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-3B-cosine-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-4B-cosine-lookup
    - source: hit
      data_type: ancillary
      descriptor: lo-gain-lookup
    - source: hit
      data_type: ancillary
      descriptor: hi-gain-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-2A-charge-fit-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-3A-charge-fit-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-4A-charge-fit-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-2B-charge-fit-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-3B-charge-fit-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-4B-charge-fit-lookup
    - source: hit
      data_type: ancillary
      descriptor: hit-event-type-lookup
  outputs:
    - source: hit
      data_type: l3
      descriptor: direct-events

(l3, macropixel):
  partition: daily
  inputs:
    - source: hit
      data_type: l2
      descriptor: macropixel-intensity
    - source: mag
      data_type: l1d
      descriptor: norm-dsrf
    - source: mag
      data_type: l2
      descriptor: norm-dsrf
      trigger_job: false
  outputs:
    - source: hit
      data_type: l3
      descriptor: macropixel

