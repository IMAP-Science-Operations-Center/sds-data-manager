# ========= Common Dependency Groups =========
# Common spice dependencies shared by multiple products
_spice_basic: &spice_basic
  - (leapseconds, spice, historical, true, false)
  - (spacecraft_clock, spice, historical, true, false)

_spice_45sensor_l1b: &spice_45sensor_l1b
  - (leapseconds, spice, historical, true, false)
  - (spacecraft_clock, spice, historical, true, false)
  - (imap_frames, spice, historical, true, false)
  - (planetary_ephemeris, spice, historical, true, false)
  - (attitude_history, spice, historical, true, true)
  - (ephemeris_reconstructed, spice, historical, true, false)
  - (ephemeris_predicted, spice, best, true, false)
  - (ephemeris_90days, spice, best, true, false)
  - (spin, spin, historical, true, false)

_spice_90sensor_l1b: &spice_90sensor_l1b
  - (leapseconds, spice, historical, true, false)
  - (spacecraft_clock, spice, historical, true, false)
  - (imap_frames, spice, historical, true, false)
  - (planetary_ephemeris, spice, historical, true, false)
  - (attitude_history, spice, historical, true, true)
  - (ephemeris_reconstructed, spice, historical, true, false)
  - (ephemeris_predicted, spice, best, true, false)
  - (ephemeris_90days, spice, best, true, false)
  - (spin, spin, historical, true, false)

_spice_l1c: &spice_l1c
  - (leapseconds, spice, historical, true, false)
  - (spacecraft_clock, spice, historical, true, false)
  - (imap_frames, spice, historical, true, false)
  - (science_frames, spice, historical, true, false)
  - (planetary_ephemeris, spice, historical, true, false)
  - (attitude_history, spice, historical, true, false)
  - (pointing_attitude, spice, historical, true, true)
  - (ephemeris_reconstructed, spice, historical, true, false)
  - (ephemeris_predicted, spice, best, true, false)
  - (ephemeris_90days, spice, best, true, false)
  - (repoint, repoint, historical, true, false)
  - (spin, spin, historical, true, false)

_spice_l2: &spice_l2
  - (leapseconds, spice, historical, true, false)
  - (science_frames, spice, historical, true, false)
  - (planetary_ephemeris, spice, historical, true, false)
  - (ephemeris_reconstructed, spice, historical, true, false)

# 45sensor specific L2 ancillary dependencies
_ancillary_45sensor_l2: &ancillary_45sensor_l2
  - (hi, ancillary, 45sensor-cal-prod, true, true)
  - (hi, ancillary, 45sensor-esa-energies, true, true)
  - (hi, ancillary, 45sensor-esa-eta-fit-factors, true, true)

# 90sensor specific L2 ancillary dependencies
_ancillary_90sensor_l2: &ancillary_90sensor_l2
  - (hi, ancillary, 90sensor-cal-prod, true, true)
  - (hi, ancillary, 90sensor-esa-energies, true, true)
  - (hi, ancillary, 90sensor-esa-eta-fit-factors, true, true)


# ======== Product-Specific Dependencies ========
(l1a, all):
  - (hi, l0, raw, true, true)
  - *spice_basic

(l1b, hk):
  - (hi, l0, raw, true, true)
  - *spice_basic

(l1b, 45sensor-de):
  - (hi, l1a, 45sensor-de, true, true)
  - (hi, l1b, 45sensor-hk, true, true)
  - (hi, ancillary, 45sensor-esa-energies, true, true)
  - *spice_45sensor_l1b

(l1b, 45sensor-goodtimes):
  - (hi, l1b, 45sensor-de, true, true, (-3p, 3p))
  - (hi, l1b, 45sensor-hk, true, true)
  - (hi, l1a, 45sensor-diagfee, true, true)
  - *spice_basic

(l1b, 90sensor-de):
  - (hi, l1a, 90sensor-de, true, true)
  - (hi, l1b, 90sensor-hk, true, true)
  - (hi, ancillary, 90sensor-esa-energies, true, true)
  - *spice_90sensor_l1b

(l1c, 45sensor-pset):
  - *spice_l1c
  - (hi, ancillary, 45sensor-cal-prod, true, true)
  - (hi, l1b, 45sensor-de, true, true)

(l1c, 90sensor-pset):
  - *spice_l1c
  - (hi, ancillary, 90sensor-cal-prod, true, true)
  - (hi, l1b, 90sensor-de, true, true)

